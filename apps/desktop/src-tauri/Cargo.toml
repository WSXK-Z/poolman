[package]
name = "desktop"
version = "0.3.0"
description = "poolman"
authors = ["wushi"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = "0.4"
tokio-tungstenite = "0.21"
tungstenite = "0.21"
futures-util = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
url = "2"
base64 = "0.22"
serde_yaml = "0.9"
sea-orm = { version = "2.0.2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "schema-sync"] }
# 官方分词器：网页渠道不回传本轮用量，用 deepseek_v4_tokenizer/tokenizer.json 精确计数。
# 关掉默认的 onig 后端，改用纯 Rust 的 fancy-regex，免去额外 C 依赖。
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
# 单测用暂停时钟（`#[tokio::test(start_paused = true)]`）精确验证排队间隔
tokio = { version = "1", features = ["test-util"] }
# 单测用 `ServiceExt::oneshot` 直接向 axum 应用发请求（验证请求体上限）
tower = "0.5"

